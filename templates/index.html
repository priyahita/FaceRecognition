<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: linear-gradient(to bottom, rgb(152, 197, 249), rgb(95, 169, 249), rgb(35, 151, 253));
  font-family: 'Fredoka', sans-serif;
  padding: 20px;
  color: #444;
  text-align: center;
  min-height: 100vh;
}

.container {
  max-width: 700px;
  margin: 60px auto;
  background-color: #fff;
  border-radius: 20px;
  padding: 40px 20px;
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
}

h1 {
  font-size: 36px;
  color: rgb(31, 93, 134);
  margin-bottom: 20px;
}

.welcome-box p {
  display: inline-block;
  padding: 10px 20px;
  color: rgb(31, 93, 134);
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 30px;
}

.button-group {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.button-group button {
  padding: 10px 24px;
  font-size: 16px;
  font-weight: 600;
  background-color: rgb(31, 93, 134);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.button-group button:hover {
  background-color: rgb(20, 80, 120);
}

  </style>
  <title>Home</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <div class="container">
    <h1>Selamat Datang!</h1>
    <div class="welcome-box">
      <p>Silakan Login atau Register untuk melanjutkan</p>
    </div>
    <div class="button-group">
      <a href="/login"><button>Login</button></a>
      <a href="/register"><button>Register</button></a>
    </div>
  </div>
</body>
</html>
